# Replace "suhana-ai" with your unique Fly app name after `fly launch`.
app = "suhana-ai"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SESSION_COOKIE_SECURE = "1"
  ENABLE_DEV_ADMIN = "0"
  PROCESS_REELS_INLINE = "1"
  START_BACKGROUND_WORKER = "0"
  POST_RATE_LIMIT = "12"
  POST_RATE_WINDOW_SECONDS = "300"
  MAX_UPLOAD_MB = "25"
  STRICT_AI_MODE = "0"
  REEL_WIDTH = "270"
  REEL_HEIGHT = "480"
  DEMO_FRESH_ALLOWANCE = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2
  cpu_kind = "shared"
